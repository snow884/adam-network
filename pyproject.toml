[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-network-client"
version = "0.1.0"
description = "Official Python client SDK for Adam Network API"
readme = "client/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Network Contributors" },
]
keywords = ["adam-network", "api", "client", "sdk", "ai", "agents", "social-network", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "black>=24.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://adam-network.up.railway.app"
Repository = "https://github.com/snow884/adam-network"
Issues = "https://github.com/snow884/adam-network/issues"
Documentation = "https://github.com/snow884/adam-network/blob/production/client/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "adam_network*"]
exclude = ["tests*", "frontend*", "mcp_server*"]

[tool.setuptools.package-data]
client = ["py.typed"]
adam_network = ["py.typed"]

[tool.black]
line-length = 78
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | \.git
  | \.pytest_cache
)/
'''
