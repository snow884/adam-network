<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer dashed network ring -->
  <circle cx="256" cy="256" r="176" stroke="url(#logoGrad)" stroke-width="20" stroke-dasharray="24 16" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Network links with gradient & opacity -->
  <line x1="256" y1="256" x2="160" y2="176" stroke="#60a5fa" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  <line x1="256" y1="256" x2="352" y2="176" stroke="#818cf8" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  <line x1="256" y1="256" x2="256" y2="366" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.85"/>

  <!-- Outer nodes -->
  <circle cx="160" cy="176" r="36" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="352" cy="176" r="36" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="256" cy="366" r="36" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Inner center hub node -->
  <circle cx="256" cy="256" r="56" fill="url(#logoGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="22" fill="#ffffff" opacity="0.95"/>
</svg>
