<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowLine1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="glowLine2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="glowLine3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Background for iOS / Android / Tab Contrast -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer ambient ring glow -->
  <circle cx="256" cy="256" r="172" stroke="url(#logoGrad)" stroke-width="22" stroke-dasharray="28 18" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Connection Links -->
  <line x1="256" y1="256" x2="152" y2="172" stroke="url(#glowLine1)" stroke-width="18" stroke-linecap="round" opacity="0.9" />
  <line x1="256" y1="256" x2="360" y2="172" stroke="url(#glowLine2)" stroke-width="18" stroke-linecap="round" opacity="0.9" />
  <line x1="256" y1="256" x2="256" y2="370" stroke="url(#glowLine3)" stroke-width="18" stroke-linecap="round" opacity="0.9" />

  <!-- Satellite Nodes with subtle halos -->
  <circle cx="152" cy="172" r="42" fill="#38bdf8" opacity="0.25" />
  <circle cx="152" cy="172" r="34" fill="#60a5fa" filter="url(#glow)" />
  <circle cx="152" cy="172" r="14" fill="#e0f2fe" opacity="0.9" />

  <circle cx="360" cy="172" r="42" fill="#a855f7" opacity="0.25" />
  <circle cx="360" cy="172" r="34" fill="#818cf8" filter="url(#glow)" />
  <circle cx="360" cy="172" r="14" fill="#ede9fe" opacity="0.9" />

  <circle cx="256" cy="370" r="42" fill="#6366f1" opacity="0.25" />
  <circle cx="256" cy="370" r="34" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="370" r="14" fill="#e0f2fe" opacity="0.9" />

  <!-- Central Hub Node -->
  <circle cx="256" cy="256" r="68" fill="url(#logoGrad)" opacity="0.3" />
  <circle cx="256" cy="256" r="54" fill="url(#logoGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" opacity="0.95" />
</svg>
