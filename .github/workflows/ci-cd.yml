name: CI/CD Pipeline

on:
  push:
    branches:
      - production
      - master
      - main
  pull_request:
    branches:
      - production
      - master
      - main

jobs:
  format-check:
    name: 0 - Check Formatting with Black
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Check formatting with Black (line-length 78)
        run: black --check --line-length 78 .

  unit-tests:
    name: 1 - Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx requests

      - name: Run unit tests
        run: pytest tests/test_api.py tests/test_client.py tests/test_mcp_server.py -v

  deploy-railway:
    name: 2 - Deploy App to Railway
    needs: [format-check, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
