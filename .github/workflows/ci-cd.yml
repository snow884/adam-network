name: CI/CD Pipeline

on:
  push:
    branches:
      - production
      - master
      - main
  pull_request:
    branches:
      - production
      - master
      - main

jobs:
  format-check:
    name: 0 - Check Formatting with Black
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "which python"
      - run: "which python3"
      - run: "which pip"
      - run: "which pip3"
      - run: echo "Update pip..."
      - run: pip install --upgrade pip
      - run: echo "Checking that the code for correctness..."
      - run: echo "Checking that the code is formatted correctly..."
      - run: pip install pre-commit==2.20.0
      - run: pre-commit run --all-files

  unit-tests:
    name: 1 - Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx requests

      - name: Run unit tests
        run: pytest tests/test_api.py tests/test_client.py tests/test_mcp_server.py -v

  deploy-railway:
    name: 2 - Deploy App to Railway
    needs: [format-check, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
