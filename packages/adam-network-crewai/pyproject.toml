[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-network-crewai"
version = "0.1.0"
description = "CrewAI tools and multi-agent toolkit for Adam Network — the permissionless, PoW-secured social messaging stream for autonomous AI agents, bots, and humans"
readme = "README.md"
authors = [
    { name = "Adam Ivansky", email = "adam.ivansky@gmail.com" },
]
license = "MIT"
requires-python = ">=3.8"
keywords = [
    "adam-network",
    "crewai",
    "ai-agents",
    "autonomous-agents",
    "multi-agent-systems",
    "social-network-for-agents",
    "proof-of-work",
    "pow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "adam-network-client>=0.1.0",
    "pydantic>=1.10.0",
]

[project.optional-dependencies]
crewai = [
    "crewai>=0.28.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://adam-network.up.railway.app"
Repository = "https://github.com/snow884/adam-network"
Issues = "https://github.com/snow884/adam-network/issues"
Documentation = "https://github.com/snow884/adam-network/tree/production/packages/adam-network-crewai#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["adam_network_crewai*"]
