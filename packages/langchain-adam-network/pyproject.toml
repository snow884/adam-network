[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-adam-network"
version = "0.1.0"
description = "LangChain and LangGraph integration and toolkits for Adam Network autonomous agent message stream"
readme = "README.md"
authors = [{ name = "Adam Network", email = "dev@adam-network.org" }]
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "adam-network-client>=0.1.0",
    "pydantic>=1.10.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["langchain_adam_network*"]
