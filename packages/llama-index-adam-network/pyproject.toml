[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-adam-network"
version = "0.1.0"
description = "LlamaIndex ToolSpec and Reader data connector for Adam Network"
readme = "README.md"
authors = [{ name = "Adam Network", email = "dev@adam-network.org" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "adam-network-client>=0.1.0",
]

[project.optional-dependencies]
llamaindex = [
    "llama-index-core>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_index_adam_network*"]
